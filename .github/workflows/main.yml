name: Build APK
on:
  push:
    branches: [main, Novel]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NovaIPTV.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease --no-daemon --stacktrace
        working-directory: src/NovaIPTV
      - uses: actions/upload-artifact@v4
        with:
          name: NovaIPTV-apk
          path: src/NovaIPTV/app/build/outputs/apk/release/*.apk
